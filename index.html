<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <div aria-hidden="true">☕</div>
    <h1>바이브 카페</h1>
    <nav class="tab-menu" role="tablist" aria-label="주문 메뉴">
      <button type="button" id="order-tab" class="tab-button" role="tab" aria-selected="true" aria-controls="order-panel">☕ 주문하기</button>
      <button type="button" id="orders-tab" class="tab-button" role="tab" aria-selected="false" aria-controls="orders-panel">
        📋 주문 내역 <span id="order-count" class="tab-count">0</span>
      </button>
    </nav>
    <p>당신의 하루에 바이브를 더하다</p>
  </header>

  <main>
    <section id="order-panel" role="tabpanel" aria-labelledby="order-tab">
      <form id="order-form" novalidate>
      <!-- 주문자 정보 -->
      <div>
        <label for="customer-name">이름 (필수)</label>
        <input type="text" id="customer-name" name="customerName" required>
      </div>

      <div>
        <label for="phone-number">전화번호</label>
        <input type="tel" id="phone-number" name="phoneNumber">
      </div>

      <!-- 음료 선택 -->
      <div>
        <label for="drink">음료 선택</label>
        <select id="drink" name="drink">
          <option value="" data-price="0">-- 음료를 선택하세요 --</option>
          <option value="아메리카노" data-price="3500">아메리카노 3,500원</option>
          <option value="카페라떼" data-price="4000">카페라떼 4,000원</option>
          <option value="카페모카" data-price="4500">카페모카 4,500원</option>
          <option value="바닐라라떼" data-price="4500">바닐라라떼 4,500원</option>
          <option value="녹차라떼" data-price="4500">녹차라떼 4,500원</option>
          <option value="딸기라떼" data-price="4500">딸기라떼 4,500원</option>
          <option value="아이스티" data-price="3000">아이스티 3,000원</option>
        </select>
      </div>

      <!-- 사이즈 선택 -->
      <fieldset>
        <legend>사이즈</legend>
        <input type="radio" id="size-s" name="size" value="S" data-price="0">
        <label for="size-s">S +0원</label>
        <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
        <label for="size-m">M +500원</label>
        <input type="radio" id="size-l" name="size" value="L" data-price="1000">
        <label for="size-l">L +1,000원</label>
      </fieldset>

      <!-- 추가 옵션 -->
      <fieldset>
        <legend>추가 옵션</legend>
        <input type="checkbox" id="extra-shot" name="options" value="샷 추가" data-price="500">
        <label for="extra-shot">샷 추가 +500원</label>
        <input type="checkbox" id="extra-cream" name="options" value="크림 추가" data-price="500">
        <label for="extra-cream">크림 추가 +500원</label>
        <input type="checkbox" id="extra-syrup" name="options" value="시럽 추가" data-price="300">
        <label for="extra-syrup">시럽 추가 +300원</label>
        <input type="checkbox" id="decaf" name="options" value="디카페인" data-price="0">
        <label for="decaf">디카페인 +0원</label>
        <input type="checkbox" id="extra-pearl" name="options" value="펄 추가" data-price="500">
        <label for="extra-pearl">펄 추가 +500원</label>
      </fieldset>

      <div>
        <label for="quantity">수량</label>
        <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
      </div>

      <div>
        <label for="request">요청사항</label>
        <textarea id="request" name="request"></textarea>
      </div>

      <p id="estimated-price" aria-live="polite">예상 금액: 0원</p>
      <button type="submit">주문하기</button>
      <button type="reset">다시 작성</button>
      </form>

      <div id="order-confirmation" class="hidden" role="status"></div>
    </section>

    <section id="orders-panel" class="hidden" role="tabpanel" aria-labelledby="orders-tab">
      <h2>주문 내역</h2>
      <div id="order-list" aria-live="polite"></div>
      <div id="order-summary" class="hidden">
        <p id="orders-total"></p>
        <button type="button" id="clear-orders">내역 모두 지우기</button>
      </div>
    </section>
  </main>
</body>
</html>
